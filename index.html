<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA Players by College</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --badge: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    .container { max-width: 1120px; margin: 0 auto; }
    header { margin-bottom: 1.5rem; }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); margin-top: 0.25rem; }
    .stats-bar {
      display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.25rem 0;
    }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .chip:hover, .chip.active {
      background: var(--badge);
      border-color: var(--accent);
    }
    .controls {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1fr 0.8fr;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 820px) {
      .controls { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 520px) {
      .controls { grid-template-columns: 1fr; }
    }
    input, select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
    }
    input:focus, select:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); }
    th {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    th:hover { color: var(--text); }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface-hover); }
    .college-pill {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.88rem;
    }
    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>NBA Players & Colleges Index</h1>
      <p class="subtitle">Browse and filter every NBA player by college, pre-NBA path, team, position, or draft class.</p>
      <div class="stats-bar" id="topColleges"></div>
    </header>

    <div class="controls">
      <input type="search" id="searchInput" placeholder="Search player, college, or team..." />
      <select id="collegeFilter">
        <option value="">All Colleges / Pre-NBA Paths</option>
      </select>
      <select id="teamFilter">
        <option value="">All Teams</option>
      </select>
      <select id="posFilter">
        <option value="">All Positions</option>
        <option value="G">Guard (G / PG / SG)</option>
        <option value="F">Forward (F / SF / PF)</option>
        <option value="C">Center (C)</option>
      </select>
    </div>

    <div class="meta-row">
      <span id="resultCount">Loading NBA rosters...</span>
      <span id="dataSource">Connecting to live NBA roster feed...</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="name">Player</th>
            <th data-sort="college">College / Pre-NBA</th>
            <th data-sort="pos">Pos</th>
            <th data-sort="team">Team</th>
            <th data-sort="draftYear">Draft</th>
          </tr>
        </thead>
        <tbody id="playerTable">
          <tr><td colspan="5" class="empty">Fetching all 30 NBA team rosters...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let players = [];
    let sortKey = "name";
    let sortAsc = true;

    const searchInput = document.getElementById("searchInput");
    const collegeFilter = document.getElementById("collegeFilter");
    const teamFilter = document.getElementById("teamFilter");
    const posFilter = document.getElementById("posFilter");
    const tableBody = document.getElementById("playerTable");
    const resultCount = document.getElementById("resultCount");
    const topCollegesEl = document.getElementById("topColleges");
    const dataSourceEl = document.getElementById("dataSource");

    function populateFilters() {
      const collegeCounts = {};
      const teamCounts = {};

      players.forEach(p => {
        collegeCounts[p.college] = (collegeCounts[p.college] || 0) + 1;
        teamCounts[p.team] = (teamCounts[p.team] || 0) + 1;
      });

      const sortedColleges = Object.keys(collegeCounts).sort();
      collegeFilter.innerHTML = `<option value="">All Colleges / Paths (${sortedColleges.length})</option>`;
      sortedColleges.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = `${c} (${collegeCounts[c]})`;
        collegeFilter.appendChild(opt);
      });

      const sortedTeams = Object.keys(teamCounts).sort();
      teamFilter.innerHTML = `<option value="">All Teams (${sortedTeams.length})</option>`;
      sortedTeams.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = `${t} (${teamCounts[t]})`;
        teamFilter.appendChild(opt);
      });

      const topColleges = Object.entries(collegeCounts)
        .filter(([name]) => !name.startsWith("None"))
        .sort((a, b) => b[1] - a[1])
        .slice(0, 7);

      topCollegesEl.innerHTML =
        `<button class="chip active" data-college="">All (${players.length})</button>` +
        topColleges.map(([c, n]) => `<button class="chip" data-college="${c}">${c} (${n})</button>`).join("");

      topCollegesEl.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => {
          collegeFilter.value = btn.dataset.college;
          render();
        });
      });
    }

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      const col = collegeFilter.value;
      const team = teamFilter.value;
      const pos = posFilter.value;

      topCollegesEl.querySelectorAll(".chip").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.college === col);
      });

      const filtered = players
        .filter(p => {
          const matchesQ = !q ||
            p.name.toLowerCase().includes(q) ||
            p.college.toLowerCase().includes(q) ||
            p.team.toLowerCase().includes(q);
          const matchesCol = !col || p.college === col;
          const matchesTeam = !team || p.team === team;
          const matchesPos = !pos || (p.pos && p.pos.includes(pos));
          return matchesQ && matchesCol && matchesTeam && matchesPos;
        })
        .sort((a, b) => {
          const valA = a[sortKey] ?? "";
          const valB = b[sortKey] ?? "";
          if (typeof valA === "number" && typeof valB === "number") {
            return sortAsc ? valA - valB : valB - valA;
          }
          return sortAsc
            ? String(valA).localeCompare(String(valB))
            : String(valB).localeCompare(String(valA));
        });

      resultCount.textContent = `Showing ${filtered.length} of ${players.length} players`;

      if (!filtered.length) {
        tableBody.innerHTML = `<tr><td colspan="5" class="empty">No players match your filter.</td></tr>`;
        return;
      }

      tableBody.innerHTML = filtered.slice(0, 1000).map(p => `
        <tr>
          <td><strong>${p.name}</strong></td>
          <td><span class="college-pill">${p.college}</span></td>
          <td>${p.pos || "—"}</td>
          <td>${p.team}</td>
          <td>${p.draftYear || "Undrafted"}</td>
        </tr>
      `).join("");
    }

    async function fetchLiveNbaRosters() {
      const teamsRes = await fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams?limit=50");
      const teamsData = await teamsRes.json();
      const teams = teamsData.sports[0].leagues[0].teams.map(t => t.team);

      const rosters = await Promise.all(
        teams.map(async team => {
          const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/${team.id}/roster`);
          const data = await res.json();
          const list = Array.isArray(data.athletes)
            ? data.athletes.flatMap(g => (g.items ? g.items : [g]))
            : [];
          return list.map(a => {
            const country = a.birthPlace?.country;
            const fallback = country && country !== "USA" ? `None (${country})` : "None / Pre-NBA";
            return {
              name: a.fullName,
              college: a.college?.name || fallback,
              pos: a.position?.abbreviation || "—",
              team: team.displayName,
              draftYear: a.draft?.year || null
            };
          });
        })
      );

      return rosters.flat();
    }

    async function init() {
      // 1. Check if full all-time players.json exists in the repo
      try {
        const localRes = await fetch("./players.json");
        if (localRes.ok) {
          const localData = await localRes.json();
          if (Array.isArray(localData) && localData.length > 0) {
            players = localData;
            dataSourceEl.textContent = `All-Time Database (${players.length} players)`;
            populateFilters();
            render();
            return;
          }
        }
      } catch (_) {}

      // 2. Otherwise fetch all 30 active NBA team rosters live
      try {
        players = await fetchLiveNbaRosters();
        dataSourceEl.textContent = `Live NBA Rosters (${players.length} active players)`;
        populateFilters();
        render();
      } catch (err) {
        dataSourceEl.textContent = "Failed to load live rosters";
        tableBody.innerHTML = `<tr><td colspan="5" class="empty">Could not load NBA roster feed. Refresh to try again.</td></tr>`;
      }
    }

    document.querySelectorAll("th[data-sort]").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.sort;
        if (sortKey === key) sortAsc = !sortAsc;
        else { sortKey = key; sortAsc = true; }
        render();
      });
    });

    [searchInput, collegeFilter, teamFilter, posFilter].forEach(el => el.addEventListener("input", render));

    init();
  </script>
</body>
</html>
