<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA Players — Click for College</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-front: #1e293b;
      --card-back: #0369a1;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-x: hidden;
      padding: 2rem 0;
    }

    .header {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto 1.75rem;
      padding: 0 1.25rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    h1 { font-size: 1.75rem; font-weight: 800; }
    .hint { color: var(--muted); font-size: 0.92rem; margin-top: 0.2rem; }

    .toolbar {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    button.ctrl {
      background: var(--card-front);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button.ctrl:hover, button.ctrl.active {
      background: var(--card-back);
      border-color: var(--accent);
    }

    /* Moving marquee container */
    .marquee {
      position: relative;
      width: 100%;
      overflow: hidden;
      padding: 1rem 0;
    }

    .marquee-track {
      display: flex;
      gap: 1rem;
      width: max-content;
      animation: scroll-left var(--speed, 55s) linear infinite;
    }

    .marquee:hover .marquee-track,
    .marquee.paused .marquee-track {
      animation-play-state: paused;
    }

    @keyframes scroll-left {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* 3D Flip Card */
    .player-card {
      width: 210px;
      height: 130px;
      perspective: 900px;
      cursor: pointer;
      flex-shrink: 0;
      user-select: none;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .player-card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card-front {
      background: var(--card-front);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .player-card:hover .card-front {
      border-color: var(--accent);
    }

    .player-name {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 0.45rem;
    }

    .player-pos {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.14);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }

    .card-back {
      background: var(--card-back);
      border-color: var(--accent);
      transform: rotateY(180deg);
    }

    .back-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #bae6fd;
      margin-bottom: 0.35rem;
    }

    .college-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
    }

    .status {
      max-width: 1100px;
      width: 100%;
      margin: 1.25rem auto 0;
      padding: 0 1.25rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>NBA Players</h1>
      <p class="hint">Click any player card to reveal their college. Hover or click Pause to freeze motion.</p>
    </div>
    <div class="toolbar">
      <button class="ctrl active" data-pos="">All</button>
      <button class="ctrl" data-pos="G">Guards</button>
      <button class="ctrl" data-pos="F">Forwards</button>
      <button class="ctrl" data-pos="C">Centers</button>
      <button class="ctrl" id="toggleMotionBtn">Pause</button>
    </div>
  </div>

  <div class="marquee" id="marquee">
    <div class="marquee-track" id="track"></div>
  </div>

  <div class="status" id="statusText">Loading NBA players...</div>

  <script>
    const FALLBACK_PLAYERS = [
      { name: "AJ Dybantsa", pos: "F", college: "BYU" },
      { name: "Darryn Peterson", pos: "G", college: "Kansas" },
      { name: "Cameron Boozer", pos: "F", college: "Duke" },
      { name: "Caleb Wilson", pos: "F", college: "North Carolina" },
      { name: "Keaton Wagler", pos: "G", college: "Illinois" },
      { name: "Mikel Brown Jr.", pos: "G", college: "Louisville" },
      { name: "Darius Acuff Jr.", pos: "G", college: "Arkansas" },
      { name: "Kingston Flemings", pos: "G", college: "Houston" },
      { name: "Morez Johnson Jr.", pos: "F", college: "Michigan" },
      { name: "Brayden Burries", pos: "G", college: "Arizona" },
      { name: "Yaxel Lendeborg", pos: "F", college: "Michigan" },
      { name: "Aday Mara", pos: "C", college: "Michigan" },
      { name: "Nate Ament", pos: "F", college: "Tennessee" },
      { name: "Shai Gilgeous-Alexander", pos: "G", college: "Kentucky" },
      { name: "Victor Wembanyama", pos: "C", college: "None (France)" },
      { name: "Jayson Tatum", pos: "F", college: "Duke" },
      { name: "Anthony Edwards", pos: "G", college: "Georgia" },
      { name: "Stephen Curry", pos: "G", college: "Davidson" },
      { name: "LeBron James", pos: "F", college: "None (High School)" },
      { name: "Bam Adebayo", pos: "C", college: "Kentucky" }
    ];

    const track = document.getElementById("track");
    const marquee = document.getElementById("marquee");
    const statusText = document.getElementById("statusText");
    const toggleMotionBtn = document.getElementById("toggleMotionBtn");

    let allPlayers = FALLBACK_PLAYERS;
    let selectedPos = "";
    let isPaused = false;

    function createCard(player) {
      const card = document.createElement("div");
      card.className = "player-card";
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front">
            <div class="player-name">${player.name}</div>
            <div class="player-pos">${player.pos}</div>
          </div>
          <div class="card-face card-back">
            <div class="back-label">College</div>
            <div class="college-name">${player.college}</div>
          </div>
        </div>
      `;
      card.addEventListener("click", () => {
        card.classList.toggle("flipped");
      });
      return card;
    }

    function renderMarquee() {
      const list = selectedPos
        ? allPlayers.filter(p => p.pos && p.pos.toUpperCase().includes(selectedPos))
        : allPlayers;

      const items = list.length ? list : FALLBACK_PLAYERS;
      track.innerHTML = "";

      // Render twice so the infinite loop seamlessly wraps
      [...items, ...items].forEach(player => {
        track.appendChild(createCard(player));
      });

      const duration = Math.max(25, items.length * 0.35);
      track.style.setProperty("--speed", `${duration}s`);
      statusText.textContent = `${items.length} players shown • Click any card to flip between Name/Position and College`;
    }

    async function loadLivePlayers() {
      try {
        const teamsRes = await fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams?limit=50");
        const teamsJson = await teamsRes.json();
        const teams = teamsJson.sports[0].leagues[0].teams.map(t => t.team);

        const rosters = await Promise.all(
          teams.map(async team => {
            const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/${team.id}/roster`);
            const data = await res.json();
            const athletes = Array.isArray(data.athletes)
              ? data.athletes.flatMap(group => (group.items ? group.items : [group]))
              : [];

            return athletes.map(a => {
              const country = a.birthPlace?.country;
              const fallbackCollege = country && country !== "USA"
                ? `None (${country})`
                : "None / Pre-NBA";
              return {
                name: a.fullName,
                pos: a.position?.abbreviation || "—",
                college: a.college?.name || fallbackCollege
              };
            });
          })
        );

        const combined = rosters.flat().filter(p => p.name);
        if (combined.length > 0) {
          allPlayers = combined;
          renderMarquee();
        }
      } catch (_) {
        renderMarquee();
      }
    }

    document.querySelectorAll("button.ctrl[data-pos]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("button.ctrl[data-pos]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedPos = btn.dataset.pos;
        renderMarquee();
      });
    });

    toggleMotionBtn.addEventListener("click", () => {
      isPaused = !isPaused;
      marquee.classList.toggle("paused", isPaused);
      toggleMotionBtn.textContent = isPaused ? "Resume" : "Pause";
      toggleMotionBtn.classList.toggle("active", isPaused);
    });

    renderMarquee();
    loadLivePlayers();
  </script>
</body>
</html>
