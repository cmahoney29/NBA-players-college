<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA Players & College Index</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-alt: #1b2640;
      --border: #2a3958;
      --accent: #f97316;
      --accent-soft: rgba(249, 115, 22, 0.14);
      --green: #10b981;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 48px;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      padding-bottom: 20px;
      margin-bottom: 22px;
      border-bottom: 2px solid var(--border);
    }

    header h1 {
      font-size: clamp(1.65rem, 3.5vw, 2.3rem);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 0.98rem;
    }

    /* Main Mode Switcher Tabs */
    .mode-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .tab-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* Controls Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .controls input,
    .controls select {
      flex: 1 1 200px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
    }

    .controls input:focus,
    .controls select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .action-btn {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .action-btn:hover {
      border-color: var(--accent);
      background: #233152;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .clear-filter-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.88rem;
    }

    /* Player Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 16px;
    }

    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 185px;
      position: relative;
    }

    .player-card:hover,
    .player-card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      outline: none;
    }

    .player-card.revealed {
      border-color: var(--green);
      background: linear-gradient(180deg, var(--surface) 0%, #11232d 100%);
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .pos-pill {
      background: var(--surface-alt);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .player-name {
      font-size: 1.22rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .nba-team {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    /* Hidden Prompt vs. Revealed College Box */
    .reveal-prompt {
      margin-top: auto;
      background: var(--accent-soft);
      border: 1px dashed var(--accent);
      color: var(--accent);
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .college-reveal {
      margin-top: auto;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 10px;
      padding: 12px;
      animation: fadeIn 0.22s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .college-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .college-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #34d399;
    }

    .conf-badge {
      font-size: 0.74rem;
      background: rgba(16, 185, 129, 0.18);
      color: #6ee7b7;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 600;
    }

    .college-meta {
      font-size: 0.83rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .college-note {
      font-size: 0.82rem;
      color: var(--muted);
      font-style: italic;
    }

    /* Overall College Index Grid */
    .college-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .college-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .college-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .college-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .college-card h3 {
      font-size: 1.18rem;
      color: var(--text);
    }

    .count-pill {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .alumni-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .alumni-chip {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: #e2e8f0;
      font-size: 0.8rem;
      padding: 3px 9px;
      border-radius: 6px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>NBA Players & College Index</h1>
      <p>Click any player card to reveal their alma mater, or browse the complete index of colleges</p>
    </header>

    <!-- View Switcher -->
    <div class="mode-tabs" role="tablist">
      <button class="tab-btn active" id="tabPlayers" role="tab" aria-selected="true">
        Players Directory
      </button>
      <button class="tab-btn" id="tabColleges" role="tab" aria-selected="false">
        Overall College Index (<span id="totalCollegesBadge">0</span>)
      </button>
    </div>

    <!-- PLAYERS VIEW -->
    <section id="playersView">
      <div class="controls">
        <input type="text" id="playerSearch" placeholder="Search player, NBA team, or college..." />
        <select id="collegeSelect">
          <option value="ALL">All Colleges</option>
        </select>
        <button type="button" class="action-btn" id="toggleAllBtn">Reveal All Colleges</button>
      </div>

      <div class="status-bar">
        <span id="playerStatus">Showing 0 players</span>
        <button type="button" class="clear-filter-btn hidden" id="clearCollegeFilter">
          Clear college filter
        </button>
      </div>

      <div class="grid" id="playerGrid"></div>
    </section>

    <!-- OVERALL COLLEGE INDEX VIEW -->
    <section id="collegesView" class="hidden">
      <div class="controls">
        <input type="text" id="collegeSearch" placeholder="Filter colleges or conferences (e.g., ACC, SEC, Duke)..." />
        <select id="collegeSort">
          <option value="COUNT">Sort: Most NBA Players</option>
          <option value="ALPHA">Sort: Alphabetical (A–Z)</option>
        </select>
      </div>

      <div class="status-bar">
        <span id="collegeStatus">Showing 0 colleges</span>
      </div>

      <div class="college-grid" id="collegeGrid"></div>
    </section>
  </div>
